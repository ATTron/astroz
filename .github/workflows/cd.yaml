name: Continuous Delivery

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  emit:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          use-cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pdoc and the Python package
        run: pip install pdoc -e bindings/python

      # Published layout: / (landing page), /zig/ (Zig autodocs), /python/ (pdoc)
      - name: Build site
        run: |
          zig build doc
          mkdir site
          mv zig-out/doc site/zig
          pdoc bindings/python/astroz -o site/python
          cp .github/landing_page.html site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: emit
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
