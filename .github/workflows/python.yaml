name: Python Wheels

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # cibuildwheel builds and tests every Python version per OS;
        # settings live in bindings/python/pyproject.toml
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # Linux gets Zig inside the build container instead (before-all)
      - name: Set up Zig
        if: runner.os == 'macOS'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # The version lives only in build.zig.zon; a release tag has to match it
      - name: Check tag matches build.zig.zon
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ZON=$(sed -n 's/^ *\.version = "\(.*\)",/\1/p' build.zig.zon)
          if [ "${GITHUB_REF#refs/tags/v}" != "$ZON" ]; then
            echo "::error::tag ${GITHUB_REF#refs/tags/} does not match build.zig.zon version $ZON"
            exit 1
          fi

      - uses: pypa/cibuildwheel@v4.2.1
        with:
          package-dir: bindings/python

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  # Make sure the wheels install on real Lambda images. 3.10 runs on Amazon
  # Linux 2 (glibc 2.26), 3.14 on Amazon Linux 2023.
  test_lambda:
    name: Lambda (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: [build_wheels]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        python: ['3.10', '3.14']

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist

      - name: Install and import in Lambda base image
        run: |
          docker run --rm --entrypoint /bin/bash \
            -v "$PWD/dist:/dist:ro" \
            public.ecr.aws/lambda/python:${{ matrix.python }} \
            -c 'set -e
                pip install --quiet --only-binary=:all: --target /tmp/pkg numpy
                pip install --quiet --no-index --no-deps --find-links /dist --target /tmp/pkg astroz
                PYTHONPATH=/tmp/pkg python -c "import astroz"'

  publish:
    name: Publish to PyPI
    needs: [build_wheels, test_lambda]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
