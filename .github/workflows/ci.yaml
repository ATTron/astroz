name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Format, tests and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          use-cache: false

      - run: zig build fmt
      - run: zig build test --summary all
      - run: zig build build-examples --summary all

  python:
    name: Python ${{ matrix.python-version }} bindings
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          use-cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # setup.py runs `zig build python-bindings` against this interpreter
      - name: Install package
        run: pip install numpy sgp4 pytest -e bindings/python

      - name: Tests
        run: python -m pytest -q bindings/python/tests

      - name: Smoke test
        shell: python
        run: |
          import numpy as np
          import astroz
          from astroz.api import Satrec, SatrecArray, jday, WGS72
          from sgp4.api import Satrec as RefSatrec, WGS72 as REF_WGS72

          print("astroz", astroz.__version__)

          l1 = "1 25544U 98067A   24127.82853009  .00015698  00000+0  27310-3 0  9995"
          l2 = "2 25544  51.6393 160.4574 0003580 140.6673 205.7250 15.50957674452123"

          tle = astroz.Tle(l1 + "\n" + l2)
          assert tle.satellite_number == 25544
          out = astroz.propagate(l1 + "\n" + l2, np.arange(100, dtype=np.float64))
          print("propagate shape:", out.shape)

          sat = Satrec.twoline2rv(l1, l2, WGS72)
          jd, fr = jday(2024, 5, 6, 12, 0, 0.0)
          err, r, v = sat.sgp4(jd, fr)
          assert err == 0, err

          jds = np.full(100, jd)
          frs = fr + np.arange(100) / 1440.0
          sat.sgp4_array(jds, frs)
          SatrecArray([sat]).sgp4(jds, frs)

          ref_err, ref_r, _ = RefSatrec.twoline2rv(l1, l2, REF_WGS72).sgp4(jd, fr)
          assert ref_err == 0, ref_err
          diff_km = float(np.linalg.norm(np.array(r) - np.array(ref_r)))
          print("position difference vs python-sgp4: %.3e km" % diff_km)
          assert diff_km < 1e-3, diff_km  # 1 m

      - name: Run python_sgp4 example
        run: python examples/python_sgp4.py
