[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astroz"
version = "0.14.0"
description = "Python bindings for astroz - high-performance astrodynamics library"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["astrodynamics", "orbital-mechanics", "sgp4", "tle", "satellite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy",
]

[project.optional-dependencies]
dev = ["sgp4"]  # For benchmarks and testing
docs = ["pdoc"]

[project.urls]
Repository = "https://github.com/ATTron/astroz"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
astroz = ["*.so", "*.dylib", "*.pyd", "py.typed", "*.pyi"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_*"
test-command = "python -c \"import astroz\""

[tool.cibuildwheel.linux]
# glibc 2.17 so the wheel also loads on Lambda's Amazon Linux 2 runtimes (glibc 2.26)
before-all = "curl -sSL https://ziglang.org/download/0.16.0/zig-$(uname -m)-linux-0.16.0.tar.xz | tar -xJ -C /opt && ln -s /opt/zig-$(uname -m)-linux-0.16.0/zig /usr/local/bin/zig"
environment = { ASTROZ_ZIG_TARGET = "$(uname -m)-linux-gnu.2.17" }
repair-wheel-command = "auditwheel repair --plat manylinux2014_$(uname -m) -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
archs = ["arm64"]
environment = { ASTROZ_ZIG_TARGET = "aarch64-macos.13.0", MACOSX_DEPLOYMENT_TARGET = "13.0" }
